# Udržiava package-lock.json v súlade s package.json.
# Pri zmene package.json vygeneruje lockfile a uloží ho späť do vetvy.
name: Lockfile

on:
  push:
    branches: [main, dizajn-c]
    paths: [package.json, .github/workflows/lockfile.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Uložiť zmenený lockfile
        run: |
          if [ -n "$(git status --porcelain package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Aktualizovaný package-lock.json"
            git push
          else
            echo "package-lock.json je aktuálny"
          fi
