# Kontrola pri každej zmene: čistá inštalácia podľa lockfile, kontrola závislostí a zostavenie webu.
name: Kontrola

on:
  push:
    branches: [main, dizajn-c]
    paths-ignore: [package.json]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-fund
      - name: Kontrola zraniteľností (len vysoké a kritické)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
